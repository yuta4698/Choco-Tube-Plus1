<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Private Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a0e08;--accent:#8b4513;--bright:#d2691e;--cyan:#f4a460;--text:#f5ead8;--muted:#b8a48f;--border:rgba(210,140,70,.22);--surface:rgba(45,26,16,.88)}
html,body{width:100%;height:100%;background:radial-gradient(900px 600px at 10% -10%,rgba(210,105,30,.14),transparent 60%),radial-gradient(700px 500px at 90% 0%,rgba(139,69,19,.18),transparent 65%),var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);overflow:hidden}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.035) 2px,rgba(0,0,0,.035) 4px)}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;pointer-events:none;transition:opacity .45s ease}
#intro.hidden{opacity:0}
.intro-logo{font:clamp(1.8rem,5vw,3.2rem) 'Share Tech Mono',monospace;letter-spacing:.04em;opacity:0;transform:translateY(12px);transition:.6s}
.intro-logo.visible{opacity:1;transform:none}.logo-inv{color:var(--bright)}.logo-tube{color:var(--cyan)}
.intro-tagline,.intro-hint{font-family:'Share Tech Mono',monospace;color:var(--muted);letter-spacing:.1em;opacity:0;transition:opacity .5s}.intro-tagline.visible,.intro-hint.visible{opacity:1}
.intro-bar{width:min(260px,60vw);height:2px;background:rgba(139,69,19,.18);opacity:0}.intro-bar.visible{opacity:1}.intro-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width 1.1s ease}
#mainPage{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s;overflow-y:auto}
#mainPage.visible{opacity:1;pointer-events:auto}
.login-wrap{width:min(420px,92vw);padding:2.4rem 2.2rem 2rem;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 0 0 1px rgba(210,140,70,.08),0 0 40px rgba(139,69,19,.3),0 0 80px rgba(210,105,30,.12),0 8px 32px rgba(0,0,0,.6);backdrop-filter:blur(16px);position:relative;transform:translateY(24px) scale(.97);transition:.7s}.visible .login-wrap{transform:none}.login-wrap:before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,rgba(210,105,30,.28),transparent 70%);pointer-events:none}.login-wrap:after{content:'';position:absolute;bottom:-60px;left:-60px;width:160px;height:160px;background:radial-gradient(circle,rgba(244,164,96,.18),transparent 70%);pointer-events:none}
.login-header{text-align:center;margin-bottom:1.8rem}.login-logo{font:1.5rem 'Share Tech Mono',monospace;letter-spacing:.03em;display:block;margin-bottom:.35rem}.login-subtitle{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.login-divider{display:flex;align-items:center;gap:.7rem;margin-bottom:1.6rem}.login-divider:before,.login-divider:after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--border),transparent)}.login-divider span{font:.68rem 'Share Tech Mono',monospace;color:rgba(148,163,184,.4);letter-spacing:.08em;white-space:nowrap}
.login-form{display:flex;flex-direction:column;gap:1rem}.field-wrap{display:flex;flex-direction:column;gap:.32rem}.field-label{font:.72rem 'Share Tech Mono',monospace;color:var(--muted);letter-spacing:.08em}.field-input-wrap{position:relative;display:flex;align-items:center}.field-icon{position:absolute;left:.85rem;color:rgba(148,163,184,.45);pointer-events:none}.field-input{width:100%;padding:.72rem 2.7rem .72rem 2.4rem;background:rgba(5,9,20,.7);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.9rem;outline:none;transition:.2s}.field-input:focus{border-color:rgba(210,105,30,.65);box-shadow:0 0 0 3px rgba(210,105,30,.12),0 0 16px rgba(210,105,30,.15)}.field-input::placeholder{color:rgba(148,163,184,.35)}.pw-toggle{position:absolute;right:.65rem;background:none;border:0;color:rgba(148,163,184,.65);cursor:pointer;padding:5px;font-size:.85rem}.pw-toggle:hover{color:var(--bright)}
.login-options{display:flex;align-items:center;justify-content:space-between;font-size:.75rem}.login-remember{display:flex;align-items:center;gap:.45rem;color:var(--muted);cursor:pointer;user-select:none}.login-remember input{width:15px;height:15px;accent-color:var(--accent)}.login-forgot{color:rgba(210,140,70,.7);text-decoration:none}.login-forgot:hover{color:var(--bright)}
.login-btn{width:100%;margin-top:.4rem;padding:.82rem;background:linear-gradient(135deg,#8b4513,#c46a25);border:0;border-radius:10px;color:#f5ead8;font-size:.92rem;font-weight:600;letter-spacing:.04em;cursor:pointer;position:relative;box-shadow:0 0 20px rgba(139,69,19,.4);transition:.2s}.login-btn:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(210,105,30,.55)}.login-btn:disabled{opacity:.6;cursor:wait}.login-error{font-size:.76rem;color:#f87171;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:8px;padding:.55rem .75rem;display:none}.login-error.show{display:block}.login-footer{text-align:center;margin-top:1.2rem;color:rgba(184,164,143,.65);font-size:.68rem;font-family:'Share Tech Mono',monospace;line-height:1.6}
#secretShellHost{position:fixed;inset:0;z-index:100;background:#000;display:none}#secretShellHost iframe{display:block;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas><div class="scanlines"></div>
<div id="intro"><div class="intro-logo" id="introLogo"><span class="logo-inv">PRIVATE</span><span class="logo-tube"> ACCESS</span></div><div class="intro-tagline" id="introTagline">SECURE ACCESS GATE</div><div class="intro-bar" id="introBar"><div class="intro-bar-fill" id="introFill"></div></div><div class="intro-hint" id="introHint">INITIALIZING...</div></div>
<div id="mainPage"><div class="login-wrap"><div class="login-header"><span class="login-logo"><span class="logo-inv">PRIVATE</span><span class="logo-tube"> ACCESS</span></span><div class="login-subtitle">セキュアアクセス</div></div><div class="login-divider"><span>ACCESS CONTROL</span></div>
<form id="loginForm" class="login-form" autocomplete="off"><div class="field-wrap"><label class="field-label" for="password">ACCESS KEY</label><div class="field-input-wrap"><span class="field-icon">◆</span><input id="password" class="field-input" type="password" placeholder="アクセスキーを入力" autocomplete="off" autofocus><button class="pw-toggle" id="pwToggle" type="button" aria-label="パスワードを表示">表示</button></div></div>
<div class="login-options"><label class="login-remember"><input id="remember" type="checkbox"> この端末で記憶</label><a class="login-forgot" href="#" id="forgot">アクセスについて</a></div>
<button class="login-btn" id="loginBtn" type="submit"><span id="btnText">認証する</span></button><div class="login-error" id="error">アクセスキーが正しくありません</div></form><div class="login-footer">AUTHORIZED ACCESS ONLY<br>SECURE SESSION / PRIVATE MODE</div></div></div>
<div id="secretShellHost"><iframe id="secretSiteFrame" title="about:blank shell" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('bgCanvas'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
resize();addEventListener('resize',resize);
let dots=Array.from({length:45},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.3,v:(Math.random()-.5)*.18}));
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.globalAlpha=.22;dots.forEach(p=>{p.y+=p.v;if(p.y<0)p.y=innerHeight;if(p.y>innerHeight)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='#d2691e';ctx.fill()});requestAnimationFrame(draw)}draw();
const intro=document.getElementById('introLogo'),tag=document.getElementById('introTagline'),bar=document.getElementById('introBar'),fill=document.getElementById('introFill'),hint=document.getElementById('introHint'),introWrap=document.getElementById('intro'),main=document.getElementById('mainPage');
setTimeout(()=>intro.classList.add('visible'),120);setTimeout(()=>tag.classList.add('visible'),500);setTimeout(()=>bar.classList.add('visible'),750);setTimeout(()=>fill.style.width='100%',800);setTimeout(()=>hint.classList.add('visible'),1000);
setTimeout(()=>{introWrap.classList.add('hidden');main.classList.add('visible');setTimeout(()=>introWrap.style.display='none',500)},1450);
const form=document.getElementById('loginForm'),input=document.getElementById('password'),btn=document.getElementById('loginBtn'),text=document.getElementById('btnText'),err=document.getElementById('error');
document.getElementById('pwToggle').onclick=()=>{const show=input.type==='password';input.type=show?'text':'password';document.getElementById('pwToggle').textContent=show?'隠す':'表示'};
document.getElementById('forgot').onclick=e=>{e.preventDefault();alert('この画面のアクセスキーを入力してください。');};
const host=document.getElementById('secretShellHost'),frame=document.getElementById('secretSiteFrame');
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='choco-secret-off'){
    localStorage.setItem('choco-secret-mode','off');
    host.style.display='none';
    frame.src='about:blank';
    document.title='Choco-Tube';
    location.replace('/');
  }
});
function showSameTabShell(){
  try{
    sessionStorage.setItem('choco-visit-unlocked','on');
    localStorage.setItem('choco-secret-mode','on');
    document.title='about:blank';
    host.style.display='block';
    frame.src=location.origin+'/?__secret_shell=1';
    return true;
  }catch(e){return false}
}
form.addEventListener('submit',async e=>{
 e.preventDefault();err.classList.remove('show');btn.disabled=true;text.textContent='認証中…';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value.trim()})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.ok){err.textContent=d.message||'アクセスキーが正しくありません';err.classList.add('show');btn.disabled=false;text.textContent='認証する';return}
  if(!showSameTabShell()){err.textContent='シークレット画面への切り替えに失敗しました。もう一度お試しください。';err.classList.add('show');btn.disabled=false;text.textContent='認証する'}
 }catch(e){err.textContent='ネットワークエラーが発生しました';err.classList.add('show');btn.disabled=false;text.textContent='認証する'}
});
})();
</script>
</body>
</html>
