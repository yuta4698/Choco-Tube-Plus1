<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Access</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#1a0e08;color:#f5ead8;font-family:Segoe UI,system-ui,sans-serif;overflow:hidden}
    #bg{position:fixed;inset:0;background:radial-gradient(900px 600px at 10% -10%,rgba(210,105,30,.14),transparent 60%),radial-gradient(700px 500px at 90% 0%,rgba(139,69,19,.18),transparent 65%),#1a0e08}
    .wrap{position:fixed;inset:0;display:grid;place-items:center}
    .card{width:min(420px,92vw);padding:2.4rem 2.2rem 2rem;background:rgba(45,26,16,.92);border:1px solid rgba(210,140,70,.22);border-radius:18px;box-shadow:0 0 40px rgba(139,69,19,.3),0 8px 32px rgba(0,0,0,.6)}
    h1{text-align:center;font:1.5rem 'Courier New',monospace;letter-spacing:.03em;margin:0 0 .35rem;color:#d2691e}
    .sub{text-align:center;color:#b8a48f;font-size:.78rem;margin-bottom:1.8rem}
    .divider{display:flex;align-items:center;gap:.7rem;margin-bottom:1.6rem;color:rgba(148,163,184,.5);font: .68rem 'Courier New',monospace}.divider:before,.divider:after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(210,140,70,.22),transparent)}
    label{display:block;font:.72rem 'Courier New',monospace;color:#b8a48f;letter-spacing:.08em;margin-bottom:.32rem}
    input{width:100%;box-sizing:border-box;padding:.72rem .9rem;background:rgba(5,9,20,.7);border:1px solid rgba(210,140,70,.22);border-radius:10px;color:#f5ead8;font-size:.9rem;outline:none}
    button{width:100%;margin-top:1.2rem;padding:.82rem;background:linear-gradient(135deg,#8b4513,#c46a25);border:0;border-radius:10px;color:#f5ead8;font-size:.92rem;font-weight:600;cursor:pointer}
    #err{margin-top:1rem;color:#f87171;font-size:.76rem;display:none}.show{display:block!important}
  </style>
</head>
<body>
<div id="bg"></div><div class="wrap"><div class="card">
<h1>PRIVATE ACCESS</h1><div class="sub">セキュアアクセス</div><div class="divider">ACCESS</div>
<form id="form" autocomplete="off"><label for="password">ACCESS KEY</label><input id="password" type="password" placeholder="アクセスキー" autocomplete="off" autofocus><button type="submit" id="btn">認証</button><div id="err">アクセスキーが正しくありません</div></form>
</div></div>
<script>
(function(){
  const form=document.getElementById('form'),input=document.getElementById('password'),btn=document.getElementById('btn'),err=document.getElementById('err');
  function google(){location.replace('https://www.google.com/search?q=');}
  function openShell(){
    const shell=window.open('about:blank','chocoSecretShell');
    if(!shell)return false;
    const src=new URL('/?__secret_shell=1',location.origin).href.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    const origin=location.origin.replace(/"/g,'&quot;');
    const html='<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>about:blank</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe src="'+src+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><script>window.addEventListener("message",function(e){if(e.data&&e.data.type==="choco-secret-off"){location.replace("'+origin+'/");}});<\\/script></body></html>';
    try{shell.document.open();shell.document.write(html);shell.document.close();shell.focus();return true}catch(e){return false}
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault();err.classList.remove('show');btn.disabled=true;btn.textContent='認証中…';
    try{
      const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value.trim()})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok||!d.ok){err.classList.add('show');btn.disabled=false;btn.textContent='認証';return}
      const opened=openShell();
      if(opened){google();}
      else{err.textContent='新しいウィンドウを開けませんでした。ポップアップを許可してください';err.classList.add('show');btn.disabled=false;btn.textContent='認証';}
    }catch(e){err.textContent='ネットワークエラーが発生しました';err.classList.add('show');btn.disabled=false;btn.textContent='認証'}
  });
})();
</script>
</body></html>
